<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Mail Sweeper</title>
  <!-- Establish the popup size before the external stylesheet loads. -->
  <style>
    html, body { width: 760px; min-width: 760px; height: 580px; min-height: 580px; margin: 0; }
  </style>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>Mail Sweeper</h1>
    <button id="scanBtn" type="button">Scan Current Folder</button>
  </header>
  <p id="folderName"></p>
  <div class="options">
    <label class="grouping" for="groupByDomain">
      <input id="groupByDomain" type="checkbox">
      Group by domain (e.g. *@web.de)
    </label>
    <label class="grouping" for="unreadOnly">
      <input id="unreadOnly" type="checkbox">
      Count only unread mail
    </label>
  </div>
  <div class="thresholds" aria-describedby="thresholdHint">
    <label for="minTotal">Minimum messages (total)
      <input id="minTotal" type="number" min="1" step="1" value="50" required>
    </label>
    <span class="alternative">or</span>
    <label for="minRecent">Minimum messages (last 72 hours)
      <input id="minRecent" type="number" min="1" step="1" value="10" required>
    </label>
  </div>
  <div class="filter-summary">
    <p id="thresholdHint" class="hint">Show addresses or domains meeting either minimum in this folder.</p>
    <button id="showAllBtn" type="button" disabled>Show all senders</button>
  </div>
  <p id="scanSummary" class="hint" aria-live="polite"></p>
  <div id="senderList">Scan a folder to see its senders.</div>
  <p class="hint">Scans this folder only, excluding subfolders. Actions apply to all mail in the row.<br>Delete marks mail read first. Spam filter applies to future mail on this account.</p>
  <p id="status" role="status" aria-live="polite"></p>
  <script src="sweeper.js"></script>
  <script src="popup.js"></script>
</body>
</html>
