<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; width: 350px; padding: 12px; margin: 0; background-color: #f9f9fb; color: #222; }
    h3 { margin-top: 0; color: #111; font-size: 16px; border-bottom: 1px solid #ddd; padding-bottom: 8px; }
    #senderList { max-height: 250px; overflow-y: auto; margin-bottom: 12px; }
    .sender-item { margin: 8px 0; display: flex; align-items: flex-start; font-size: 13px; }
    .sender-item input { margin-right: 8px; margin-top: 2px; cursor: pointer; }
    .sender-item label { cursor: pointer; word-break: break-all; }
    .count { font-weight: bold; color: #e11d48; margin-right: 4px; }
    button { width: 100%; padding: 10px; background: #2563eb; color: white; border: none; border-radius: 6px; font-weight: 500; cursor: pointer; margin-top: 5px; }
    button:hover { background: #1d4ed8; }
    #status { margin-top: 8px; font-size: 12px; color: #666; font-style: italic; }
  </style>
</head>
<body>
  <h3>High-Volume Spam Sweeper</h3>
  <div id="senderList">Click "Scan Folder" to analyze mail...</div>
  <button id="scanBtn">Scan Current Folder</button>
  <button id="deleteBtn" style="display:none; background-color: #dc2626;">Delete Selected & Mark Read</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
