<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Mail Sweeper</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>Mail Sweeper</h1>
    <button id="scanBtn" type="button">Scan Current Folder</button>
  </header>
  <p id="folderName"></p>
  <div class="thresholds" aria-describedby="thresholdHint">
    <label for="minTotal">Minimum messages (total)
      <input id="minTotal" type="number" min="1" step="1" value="50" required>
    </label>
    <span class="alternative">or</span>
    <label for="minRecent">Minimum messages (last 72 hours)
      <input id="minRecent" type="number" min="1" step="1" value="10" required>
    </label>
  </div>
  <p id="thresholdHint" class="hint">Show senders meeting either minimum in this folder.</p>
  <div id="senderList">Scan a folder to see its senders.</div>
  <p class="hint">Actions apply to all mail from the sender in this folder. Delete marks mail read first.<br>Spam filter applies to future mail on this account.</p>
  <p id="status" role="status" aria-live="polite"></p>
  <script src="sweeper.js"></script>
  <script src="popup.js"></script>
</body>
</html>
